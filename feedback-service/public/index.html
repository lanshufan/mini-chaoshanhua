<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>潮汕话词典 · 反馈管理</title><link rel="stylesheet" href="./style.css"><script src="./admin.js" defer></script></head><body><header><span>潮汕话词典</span><h1>听见每一个声音</h1><p>反馈管理 · 认真回应，让词典更好</p></header><main>
<p id="notice" role="status" aria-live="polite"></p>
<form id="login" class="panel"><h2>管理员登录</h2><label>用户名<input id="username" autocomplete="username" maxlength="64" required></label><label>密码<input id="password" type="password" autocomplete="current-password" maxlength="256" required></label><button>登录后台</button></form>
<section id="workspace" hidden><div class="toolbar"><label>处理状态<select id="filter"><option value="">全部反馈</option><option value="pending">待处理</option><option value="processing">处理中</option><option value="resolved">已解决</option><option value="closed">已关闭</option></select></label><button id="refresh" class="secondary">刷新</button><button id="logout" class="secondary">退出登录</button></div><div class="columns"><section class="panel"><h2>反馈列表</h2><div id="items"></div><button id="more" class="secondary" hidden>加载更多</button></section><section class="panel" id="detail"><p class="muted">选择一条反馈，查看内容并回复。</p></section></div></section>
</main></body></html>
