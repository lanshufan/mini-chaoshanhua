name: mini-chaoshanhua
services:
  dictionary:
    build: .
    restart: unless-stopped
    environment:
      AUDIO_PROVIDER: ${AUDIO_PROVIDER:-chaofayin}
      CHENGHAI_AUDIO_TRIAL: ${CHENGHAI_AUDIO_TRIAL:-false}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-flash}
      LLM_MAX_CALLS_PER_DAY: ${LLM_MAX_CALLS_PER_DAY:-200}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_PREFIX: ${REDIS_PREFIX:-chaoshan:}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:6917:6917"
    volumes:
      - ./audio:/app/audio:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  feedback:
    build: ./feedback-service
    restart: unless-stopped
    environment:
      MYSQL_HOST: ${FEEDBACK_MYSQL_HOST:-host.docker.internal}
      MYSQL_PORT: ${FEEDBACK_MYSQL_PORT:-3306}
      MYSQL_USER: ${FEEDBACK_MYSQL_USER:-feedback_app}
      MYSQL_PASSWORD: ${FEEDBACK_MYSQL_PASSWORD:-}
      MYSQL_DATABASE: mini_feedback
      WX_APP_ID: wx22ac9a1fd50b56ca
      WX_APP_SECRET: ${WX_APP_SECRET:-}
      FEEDBACK_IDENTITY_KEY: ${FEEDBACK_IDENTITY_KEY:-}
      FEEDBACK_PUBLIC_URL: ${FEEDBACK_PUBLIC_URL:-https://games.issuescook.cn/chaoshan/feedback}
      TRUST_PROXY: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:6918:6918"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 256m
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"