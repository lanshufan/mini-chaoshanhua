name: mini-chaoshanhua
services:
  dictionary:
    build: .
    restart: unless-stopped
    environment:
      AUDIO_PROVIDER: ${AUDIO_PROVIDER:-chaofayin}
    ports:
      - "127.0.0.1:6917:6917"
    volumes:
      - ./audio:/app/audio:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
